# Site settings
title: Auto Škola GAS
email: info@autoskolagas.rs
description: >-
  Profesionalna autoškola sa iskusnim instruktorima.
  Osposobljavanje kandidata za vozače svih kategorija.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://autoskolagas.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
theme: minima

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Collections
collections:
  services:
    output: true
    permalink: /services/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
